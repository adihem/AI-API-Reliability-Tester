[project]
name = "ai-api-reliability-tester"
version = "0.1.0"
description = "Reproducible reliability experiments for AI APIs: retries, validation, latency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    # ponytail: numpy 2.5.4's random/mtrand DLL was blocked by Windows Application Control
    # on the dev machine; lift the cap once a newer build imports cleanly.
    "numpy<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tester = "tester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
