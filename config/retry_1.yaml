name: retry_1
dataset: datasets/prompts.json

model:
  name: minimax/minimax-m3.1-flash:free
  base_url: https://openrouter.ai/api/v1
  api_key_env: API_KEY

request:
  temperature: 0.2
  max_tokens: 500
  timeout_seconds: 20

test:
  requests: 30
  concurrency: 1

retry:
  enabled: true
  max_attempts: 2  # 1 retry
  backoff_seconds: 1
  max_backoff_seconds: 30
  retry_on: [TIMEOUT, CONNECTION_ERROR, RATE_LIMIT, SERVER_ERROR]

validation:
  type: exact_match
